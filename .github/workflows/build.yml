name: Mi Cultivo (celu + APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Datos de Supabase (si los cargaste como variables del repo)
        env:
          SB_URL: ${{ vars.SUPABASE_URL }}
          SB_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SB_URL" ] && [ -n "$SB_KEY" ]; then
            node -e "require('fs').writeFileSync('cloud.config.json',JSON.stringify({url:process.env.SB_URL.trim(),anonKey:process.env.SB_KEY.trim()}))"
            echo "Usando las variables SUPABASE_URL / SUPABASE_ANON_KEY"
          else
            echo "Usando cloud.config.json del repositorio"
          fi
      - name: Armar la versión web
        run: bash build-web.sh
      - name: Verificar que tenga los datos de Supabase
        run: |
          grep -q 'supabase.co' web/config.js || { echo "::error::Falta la URL de Supabase (cloud.config.json o variable SUPABASE_URL)"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  pages:
    needs: web
    runs-on: ubuntu-latest
    continue-on-error: true   # si todavía no activaste GitHub Pages, esto falla pero el APK se arma igual
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - id: dep
        uses: actions/deploy-pages@v4

  apk:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: web
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Proyecto Android
        working-directory: mobile
        run: |
          rm -rf www && cp -r ../web www
          npm install --no-audit --no-fund
          npx cap add android
          python3 patch-android.py android
          npx cap sync android
      - name: Compilar
        working-directory: mobile/android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          chmod +x gradlew
          if [ -n "$KS_B64" ]; then ./gradlew assembleRelease --no-daemon; else ./gradlew assembleDebug --no-daemon; fi
      - name: Firmar y nombrar el APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          OUT=mobile/android/app/build/outputs/apk
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.jks"
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/zipalign" -p -f 4 "$OUT/release/app-release-unsigned.apk" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/ks.jks" --ks-pass env:KS_PASS --key-pass env:KS_PASS --ks-key-alias "$KS_ALIAS" --out MiCultivo.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify MiCultivo.apk
            rm -f "$RUNNER_TEMP/ks.jks"
          else
            echo "::warning::Sin keystore: APK firmado de prueba (sirve igual para instalar)."
            cp "$OUT/debug/app-debug.apk" MiCultivo.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: MiCultivo-apk
          path: MiCultivo.apk
